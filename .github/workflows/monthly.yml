name: Monthly Python run

on:
  schedule:
    - cron: "59 15 19 * *"
  workflow_dispatch: {}

jobs:
  run-script:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/London

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write Google service account file
        run: |
          cat > service_account.json <<'JSON'
          ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          JSON

      - name: Run scripts
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          python fetch_CWT_ICB_latest.py
          python fetch_CWT_Trust_latest.py

